<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger</title>
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-top">
      <img class="wordmark-icon" src="favicon.png" alt="" />
      <div class="sidebar-top-text">
        <span class="wordmark">Ledger</span>
        <span class="workspace-label">Personal</span>
      </div>
    </div>

    <div class="sidebar-search">
      <input type="text" id="searchInput" placeholder="Search tasks" />
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item active" href="#" id="navBoard">
        <span class="nav-icon" data-icon="board"></span>
        Board
      </a>
      <a class="nav-item" href="#" id="navFavorites">
        <span class="nav-icon" data-icon="star"></span>
        Favorites
      </a>
      <a class="nav-item" href="#" id="navSettings">
        <span class="nav-icon" data-icon="settings"></span>
        Settings
      </a>
    </nav>

    <div class="sidebar-section">
      <span class="sidebar-section-label">Workspace</span>
      <div id="workspaceList"></div>
      <button class="board-item add-workspace-btn" id="addWorkspaceBtn">+ New board</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="boardTitle">My tasks</h1>
        <span class="today-date" id="todayDate"></span>
      </div>

      <div class="toolbar">
        <button class="tb-btn tb-btn-primary" id="newItemBtn">New item</button>
        <button class="tb-btn" disabled>Person</button>
        <div class="tb-dropdown">
          <button class="tb-btn" id="filterBtn">Filter</button>
          <div class="tb-panel" id="filterPanel" hidden>
            <button type="button" class="tb-panel-item" data-filter="all">All priorities</button>
            <button type="button" class="tb-panel-item" data-filter="high">High only</button>
            <button type="button" class="tb-panel-item" data-filter="normal">Normal only</button>
            <button type="button" class="tb-panel-item" data-filter="low">Low only</button>
          </div>
        </div>
        <div class="tb-dropdown">
          <button class="tb-btn" id="sortBtn">Sort</button>
          <div class="tb-panel" id="sortPanel" hidden>
            <button type="button" class="tb-panel-item" data-sort="due">Due date</button>
            <button type="button" class="tb-panel-item" data-sort="priority">Priority</button>
            <button type="button" class="tb-panel-item" data-sort="title">Title (A-Z)</button>
          </div>
        </div>
        <button class="tb-btn" disabled>Group by</button>
      </div>

      <div class="topbar-right">
        <div class="readout" id="overdueReadout"></div>
        <div class="avatar-badge" id="avatarBadge">K</div>
      </div>
    </header>

    <div class="board-scroll" id="boardScroll">

      <div id="groupsContainer"></div>

      <button class="add-group-btn" id="addGroupBtn">+ Add new group</button>

      <div class="footer" id="syncStatus"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal">
    <h2 id="modalTitle">New task</h2>
    <form id="taskForm">
      <label>
        Title
        <input type="text" id="fieldTitle" maxlength="120" placeholder="What needs to get done?" required />
      </label>
      <label>
        Notes
        <textarea id="fieldDescription" rows="3" placeholder="Optional detail"></textarea>
      </label>
      <div class="form-row">
        <label>
          Due date
          <input type="date" id="fieldDueDate" />
        </label>
        <label>
          Priority
          <div class="chip-group" id="priorityChips">
            <button type="button" class="chip chip-low" data-priority="low">Low</button>
            <button type="button" class="chip chip-normal" data-priority="normal">Normal</button>
            <button type="button" class="chip chip-high" data-priority="high">High</button>
          </div>
          <select id="fieldPriority" hidden>
            <option value="low">Low</option>
            <option value="normal" selected>Normal</option>
            <option value="high">High</option>
          </select>
        </label>
        <label>
          Status
          <select id="fieldStatus">
            <option value="todo">To do</option>
            <option value="in_progress">In progress</option>
            <option value="done">Done</option>
          </select>
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-danger" id="deleteBtn" hidden>Delete</button>
        <div class="modal-actions-right">
          <button type="button" class="btn-ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn-primary" id="saveBtn">Save task</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="settingsOverlay" hidden>
  <div class="modal">
    <h2>Settings</h2>
    <form id="settingsForm">
      <label>
        Display name
        <input type="text" id="fieldDisplayName" maxlength="40" placeholder="Your name" />
      </label>
      <label>
        Theme
        <select id="fieldTheme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
        </select>
      </label>
      <div class="modal-actions modal-actions-end">
        <div class="modal-actions-right">
          <button type="button" class="btn-ghost" id="settingsCancelBtn">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="promptOverlay" hidden>
  <div class="modal modal-sm">
    <h2 id="promptTitle">New item</h2>
    <form id="promptForm">
      <label>
        <span id="promptLabel">Name</span>
        <input type="text" id="promptInput" maxlength="80" required />
      </label>
      <label class="checkbox-label" id="promptCheckboxRow" hidden>
        <input type="checkbox" id="promptCheckbox" />
        <span id="promptCheckboxLabel">Counts as completed</span>
      </label>
      <div class="modal-actions modal-actions-end">
        <div class="modal-actions-right">
          <button type="button" class="btn-ghost" id="promptCancelBtn">Cancel</button>
          <button type="submit" class="btn-primary" id="promptOkBtn">Create</button>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="confirmOverlay" hidden>
  <div class="modal modal-sm">
    <h2 id="confirmTitle">Are you sure?</h2>
    <p class="modal-message" id="confirmMessage"></p>
    <div class="modal-actions modal-actions-end">
      <div class="modal-actions-right">
        <button type="button" class="btn-ghost" id="confirmCancelBtn">Cancel</button>
        <button type="button" class="btn-primary" id="confirmOkBtn">Confirm</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
